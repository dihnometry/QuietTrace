<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuietTracE — vista local (mock)</title>
  <style>
    html, body { height: 100%; margin: 0; }
    #stage { width: 100%; height: 100%; border: 0; }
    #badge {
      position: fixed; right: 12px; bottom: 12px; z-index: 10;
      font: 12px/1.4 system-ui, sans-serif; color: #9aa6c7;
      background: #151d38; border: 1px solid #24305a; border-radius: 8px;
      padding: 6px 10px;
    }
  </style>
</head>
<body>
  <!--
    Vista local SOLO para desarrollo. Simula el runtime de Qollab:
      1. carga el index.html real dentro de un iframe,
      2. inyecta main.css (en Qollab el runtime lo carga solo),
      3. rellena #counts con conteos de ejemplo (en Qollab los produce `backend`).
    No forma parte del proyecto que se sube a Qollab.
  -->
  <iframe id="stage" src="../index.html" title="QuietTracE preview"></iframe>
  <div id="badge">vista local (mock) — no refleja `backend` real</div>

  <script>
    const frame = document.getElementById('stage');
    const MOCK_COUNTS = { '00': 508, '11': 516 };

    frame.addEventListener('load', () => {
      const doc = frame.contentDocument;

      const link = doc.createElement('link');
      link.rel = 'stylesheet';
      link.href = '../main.css';
      doc.head.appendChild(link);

      const out = doc.getElementById('counts');
      if (out) out.textContent = JSON.stringify(MOCK_COUNTS, null, 2);
    });
  </script>
</body>
</html>
